# Releases lines when its release pull request is merged (release-pr.yml): tags the version, builds
# the desktop apps on macOS, Windows and Linux, attaches them and their signed update packages to a
# GitHub release with the version's notes from CHANGELOG.md, adds the update manifest the apps
# check, publishes it, and deploys the website again for its downloads. docs/releasing.md has the
# whole process.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: "${{ startsWith(github.event.head_commit.message, 'chore(release): v') }}"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - id: version
        run: echo "version=$(bun -e 'console.log(require("./package.json").version)')" >> "$GITHUB_OUTPUT"
      - name: Tag it, and draft its release with its notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "lines is in alpha: early and changing. Export your notes now and then (Settings → Data → Export)."
            echo
            echo "The apps aren't signed yet. On a Mac, open lines once with right-click → Open (or System Settings → Privacy & Security → Open Anyway); on Windows, choose More info → Run anyway."
            echo
            bun scripts/release.mjs notes "$VERSION"
          } > "$notes"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --draft --verify-tag --title "lines $VERSION" --notes-file "$notes"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # One app for Apple silicon and Intel Macs.
          - os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: windows-latest
            args: ""
            targets: ""
          # The oldest Ubuntu the AppImage should still run on.
          - os: ubuntu-22.04
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.tag.outputs.version }}
      - name: Linux libraries Tauri builds against
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable
          for target in ${{ matrix.targets }}; do rustup target add "$target"; done
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: TeX, which the desktop apps include for LaTeX notes' PDFs
        run: bun run tex-assets
      - name: OpenSCAD, which the apps include for 3D models made from code
        run: bun run openscad-assets
      - name: Build
        # With the packages the apps update themselves from, each signed (a .sig beside it).
        shell: bash
        run: bun run tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          # Unsplash's and GIPHY's keys for /unsplash and /giphy; without them those plugins are off.
          VITE_UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          # The key whose public half is in tauri.conf.json; the apps install only what it signed.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Name the downloads by the system they're for, lines_0.3.3_macos_universal.dmg
        shell: bash
        run: bun scripts/release.mjs name-downloads "$VERSION" src-tauri/target
      - name: Attach the installers and update packages to the release
        shell: bash
        run: |
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -print0 | xargs -0 gh release upload "v$VERSION" --clobber

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To deploy the website again (website.yml).
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Add the update manifest the apps check (latest.json)
        run: |
          gh release download "v$VERSION" --pattern '*.sig' --dir "$RUNNER_TEMP/signatures"
          bun scripts/release.mjs manifest "$VERSION" "$RUNNER_TEMP/signatures" > "$RUNNER_TEMP/latest.json"
          gh release upload "v$VERSION" "$RUNNER_TEMP/latest.json" --clobber
      - name: Publish the release
        run: gh release edit "v$VERSION" --draft=false
      # A release published with this workflow's token starts no workflow by itself; a dispatch does.
      - name: Offer its downloads on the website
        run: gh workflow run website.yml --ref main
