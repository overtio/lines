<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Frames show only lines' own pages (a PDF it made, a book's chapter) and Spotify's and SoundCloud's players, never another page from the web (the apps' policy, src-tauri/tauri.conf.json, says the same and more). -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'self' blob: https://open.spotify.com https://w.soundcloud.com https://www.youtube-nocookie.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Beautiful, simple, local-first notes." />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>lines</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
