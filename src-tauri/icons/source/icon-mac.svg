<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- macOS layout: an 824px rounded square centered on the 1024px canvas, with Apple's drop shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3d"/>
      <stop offset="1" stop-color="#121213"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="2"/>
  <g transform="translate(100 100) scale(0.8046875)" stroke="#fafafa" stroke-width="72" stroke-linecap="round">
    <line x1="272" y1="352" x2="752" y2="352"/>
    <line x1="272" y1="512" x2="752" y2="512"/>
    <line x1="272" y1="672" x2="560" y2="672"/>
  </g>
</svg>
