[package]
name = "lines"
version = "0.4.2"
description = "Beautiful, simple, local-first notes"
authors = ["lines contributors"]
license = "AGPL-3.0-only"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lines_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
# Any header a request in a note sets is sent (http plugin), Origin and Cookie included.
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }

# Updates from GitHub's releases (src/updates.rs); phones update from their stores.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
semver = "1"
time = { version = "0.3", features = ["parsing", "serde"] }

# The folder picker for cloud drive sync on Windows and Linux; the Mac's is AppKit's (src/folder_sync.rs).
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-dialog = "2.8.4"

# SF Symbols are drawn by the OS at runtime (see src/sf_symbols.rs).
[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
security-framework = "3"
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError", "block2"] }
block2 = "0.6"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-ui-kit = "0.3"
block2 = "0.6"

[dev-dependencies]
time = { version = "0.3", features = ["macros"] }
